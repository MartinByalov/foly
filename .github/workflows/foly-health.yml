name: Foly provider health
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: read
jobs:
  provider-health:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Remove previous health reports
        run: |
          Remove-Item -LiteralPath 'data/foly-source-health.json', 'data/foly-browser-health.json' -ErrorAction SilentlyContinue
      - name: Node API, rights and media checks
        id: live
        continue-on-error: true
        run: node scripts/check-foly-sources.mjs
      - name: Browser CORS, card rendering, answer reveal and preview checks
        id: browser
        continue-on-error: true
        run: node scripts/check-foly-browser.mjs
      - name: Upload actual health reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: foly-health
          path: |
            data/foly-source-health.json
            data/foly-browser-health.json
          if-no-files-found: warn
      - name: Summarize provider health
        if: always()
        env:
          NODE_OUTCOME: ${{ steps.live.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          @"
          ## External provider health
          Node API checks: $env:NODE_OUTCOME
          Browser checks: $env:BROWSER_OUTCOME

          This workflow checks live external services, separately from code regression tests.
          Download the foly-health artifact for per-provider results. A missing report is not a pass.
          "@ >> $env:GITHUB_STEP_SUMMARY
      - name: Fail when a live check failed
        if: steps.live.outcome == 'failure' || steps.browser.outcome == 'failure'
        run: throw 'Provider health checks failed. See report artifacts; failed results are not approved.'